name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  FILTR_TAG: v0.2.1
  FILTR_VERSION: 0.2.1
  FILTR_BUILD: "21"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project Filtr.xcodeproj

      - name: Build Release (unsigned / ad-hoc)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Filtr.xcodeproj \
            -scheme Filtr \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="${FILTR_VERSION}" \
            CURRENT_PROJECT_VERSION="${FILTR_BUILD}" \
            build

      - name: Package zip + fancy DMG
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release -name 'Filtr.app' -type d -maxdepth 2 | head -n 1)"
          if [[ -z "${APP}" || ! -d "${APP}" ]]; then
            echo "Filtr.app not found under DerivedData/Build/Products/Release"
            find DerivedData -name '*.app' -type d || true
            exit 1
          fi
          echo "Found app at: ${APP}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "${APP}" dist/Filtr.app.zip
          chmod +x scripts/make-fancy-dmg.sh
          scripts/make-fancy-dmg.sh "${APP}" dist/Filtr.dmg
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filtr-macOS
          path: |
            dist/Filtr.app.zip
            dist/Filtr.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${FILTR_TAG}"
          TITLE="Filtr ${FILTR_VERSION} — fancy installer DMG"
          NOTES="$(cat <<'EOF'
          Professional menu-bar Filtr with first-run setup, in-app updates, and a drag-to-Applications installer DMG.

          **Install**
          1. Download `Filtr.dmg` (preferred) or `Filtr.app.zip`
          2. Open the DMG → **Drag Filtr to Applications**
          3. First launch: **Right-click → Open** (Gatekeeper; unsigned)

          Soft limits only. Grant Accessibility / Automation for browser site matching.
          EOF
          )"

          ASSETS=(dist/Filtr.app.zip dist/Filtr.dmg)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi

          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "Zip: https://github.com/${{ github.repository }}/releases/download/${TAG}/Filtr.app.zip"
          echo "DMG: https://github.com/${{ github.repository }}/releases/download/${TAG}/Filtr.dmg"
